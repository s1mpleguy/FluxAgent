server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: ${ECHOMIND_ENV_FILE:optional:file:.env[.properties]}
  application:
    name: flux-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:deepseek}
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:echomind123}
      timeout: 2s
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:${LLM_STARTUP_API_KEY:echomind-local-placeholder}}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
          temperature: 0.2
          max-tokens: 1024
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8001}
        collection-name: ${CHROMA_COLLECTION:echomind_knowledge}
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

echomind:
  jev:
    enabled: ${JEV_ENABLED:true}
    base-url: ${JEV_BASE_URL:https://www.dmxapi.cn}
    api-key: ${JEV_API_KEY:${DMX_API_KEY:}}
    model: ${JEV_MODEL:jev-latest}
    timeout: ${JEV_TIMEOUT:8s}
    min-confidence: ${JEV_MIN_CONFIDENCE:0.7}
  llm:
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
  memory:
    ttl-seconds: ${MEMORY_TTL_SECONDS:86400}
    working-max: ${MEMORY_WORKING_MAX:20}
    compress-at: ${MEMORY_COMPRESS_AT:15}
  rag:
    top-k: ${RAG_TOP_K:4}
    bm25-weight: ${RAG_BM25_WEIGHT:0.45}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.55}
  storage:
    data-dir: ${ECHOMIND_DATA_DIR:data/java}
    knowledge-path: ${KNOWLEDGE_STORE_PATH:${ECHOMIND_DATA_DIR:data/java}/knowledge-store.json}
    memory-path: ${MEMORY_STORE_PATH:${ECHOMIND_DATA_DIR:data/java}/memory-store.json}
  monitor:
    success-rate-threshold: ${MONITOR_SUCCESS_RATE_THRESHOLD:0.90}
    latency-ms-threshold: ${MONITOR_LATENCY_MS_THRESHOLD:3000}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    anomaly-window-size: ${MONITOR_ANOMALY_WINDOW_SIZE:30}
    anomaly-min-samples: ${MONITOR_ANOMALY_MIN_SAMPLES:10}
    zscore-threshold: ${MONITOR_ZSCORE_THRESHOLD:3.0}
  eval:
    baseline-path: ${EVAL_BASELINE_PATH:data/eval/baseline.json}
  skills:
    root-dir: ${ECHOMIND_SKILLS_DIR:skills}
    max-prompt-chars: ${ECHOMIND_SKILLS_MAX_PROMPT_CHARS:5000}

---
spring:
  config:
    activate:
      on-profile: deepseek
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${DMX_API_KEY:${LLM_STARTUP_API_KEY:echomind-local-placeholder}}}
      base-url: ${DEEPSEEK_BASE_URL:https://www.dmxapi.cn}
      chat:
        completions-path: ${DEEPSEEK_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4.1-flash-1017}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}
          max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}

---
spring:
  config:
    activate:
      on-profile: anthropic
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
