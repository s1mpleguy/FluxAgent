global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fluxagent
    environment: production

rule_files:
  - prometheus-alerts.yml

scrape_configs:
  - job_name: echomind-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - echomind-java:8080
        labels:
          service: fluxagent

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
